    stroke-width="2"
    stroke-linejoin="round"
  />
  <path
    d="m12.9 15.4 2.4 2.4 4-4.3"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
